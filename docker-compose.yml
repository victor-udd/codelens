# CodeLens development database. Dedicated container, database and volume;
# does not share anything with other projects (e.g. DevHub).
# Start: npm run db:start   Stop: npm run db:stop   Migrate: npm run db:deploy
services:
  db:
    image: postgres:18
    container_name: codelens-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: codelens_dev
      # Loopback-only dev cluster; matches DATABASE_URL in .env (no password).
      # Do not publish this port beyond 127.0.0.1.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      # postgres:18 stores PGDATA under /var/lib/postgresql/18/docker; mount
      # the parent directory as recommended for this image major version.
      - codelens_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codelens_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  codelens_pgdata:
    name: codelens_pgdata
