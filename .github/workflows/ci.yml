name: CI

# The repository's main development branch is `main`.
'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Throwaway CI-only credentials; no real secrets are configured or printed.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://codelens:test-only@127.0.0.1:5432/codelens_ci?schema=public
      # Empty -> AI_API_KEY is optional; tests use fake adapters/mocked fetch.
      AI_API_KEY: ''
      # Throwaway keys for the HTTP auth/rate-limit test suites.
      API_KEYS: 'test-user-key'
      ADMIN_API_KEYS: 'test-admin-key'

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: codelens
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: codelens_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codelens -d codelens_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --health-start-period 5s

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # package.json requires >= 22.9.0; Node 22 is the matching LTS line.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Run tests
        run: npm test
